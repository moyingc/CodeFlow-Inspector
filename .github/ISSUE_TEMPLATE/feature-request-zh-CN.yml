name: 功能建议
description: 建议新的分析能力、语言适配器、工作流或可用性改进。
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述当前较难完成的用户决策或工作流。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 请说明输入、输出、证据要求和本地/离线预期。
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 所需证据等级
      options:
        - 确定性静态证据
        - Compiler/LSP 证据
        - 受控运行证据
        - 形式化证明或反例
        - 仅界面改进
    validations:
      required: true
