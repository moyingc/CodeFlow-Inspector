name: 错误报告
description: 报告可复现的解析、桌面界面、图谱、运行或导出问题。
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 受影响区域
      options:
        - 项目导入与存储
        - 解析与语言服务
        - 函数与数据路径图
        - 运行、调试或数字孪生
        - 安全或程序验证
        - 知识包与扩展包
        - PDF 报告
        - 桌面安装或更新
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本和操作系统
      placeholder: "0.1.0, macOS 15.6 arm64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿附加专有源代码、凭据、数据库文件或私密运行输出。
      placeholder: |
        1. 导入……
        2. 打开……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为和实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 请尽量提供截图、错误文字、证据等级和最小样例项目。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除源代码、令牌、个人数据、私有路径和机密运行输出。
          required: true
